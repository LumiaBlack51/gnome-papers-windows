name: Windows build and save regression tests
on:
  push:
    branches: [main, windows-save]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-poppler
            mingw-w64-ucrt-x86_64-djvulibre
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-libtiff
            mingw-w64-ucrt-x86_64-blueprint-compiler
            mingw-w64-ucrt-x86_64-gettext
            mingw-w64-ucrt-x86_64-appstream
            mingw-w64-ucrt-x86_64-nsis
            git
            diffutils
      - name: Normalize Blueprint compiler interpreter
        shell: msys2 {0}
        run: |
          # Packaged scripts can retain the package builder's absolute Python path.
          sed -i '1c#!/usr/bin/env python3' "$MINGW_PREFIX/bin/blueprint-compiler"
          blueprint-compiler --version
      - name: Build, test and package
        shell: msys2 {0}
        run: |
          MSYS_ROOT="$(cygpath -w /)"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File build-aux/windows/build.ps1 -MsysRoot "$MSYS_ROOT"
      - uses: actions/upload-artifact@v4
        with:
          name: papers-windows-installer-x64
          path: papers-*-installer-x64.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/meson-logs/testlog.txt
